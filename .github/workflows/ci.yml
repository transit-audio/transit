# The push gate (issue #4): clippy, tests and the layer check on every pull request and every push
# to main, on Windows (default WASAPI, native WASAPI, ASIO), Linux and macOS.
# Hardware tests are #[ignore]d and never run here (docs/contributing/evidence/hardware-and-ci.md).
# release.yml and rt.yml still run on tags; rt.yml also runs on pushes and pull requests that touch
# the realtime crates.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE*'
      - 'NOTICE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE*'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows (wasapi, native-wasapi)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update && rustup default stable
        shell: bash
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows
      - name: Tooling script checks
        shell: pwsh
        run: ./xtask/tests/tooling.ps1
      - run: cargo xtask layers
      - run: cargo xtask assets
      - run: cargo xtask timing
      - run: cargo xtask help
      # Check production host code without the integration tests' self-dev feature activation.
      - run: cargo check --locked -p transit-clap-host -p transit-vst3-host --lib
      - run: cargo clippy --locked --workspace --all-targets --features transit/native-wasapi,transit/native-asio -- -D warnings
      # Lib targets only: the dev-dependencies of the test targets turn the `testing` feature on, so a
      # warning that exists only with it off would otherwise reach the release build alone (#215).
      - run: cargo clippy --locked -p transit-mix -p transit-plugin-host -p transit-dsp -p transit-rt -- -D warnings
      - run: cargo test --locked --workspace --features transit/native-wasapi,transit/native-asio

  linux:
    name: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux system libraries
        # libjack-jackd2-dev: jack.pc for jack-sys's build script (native-jack); libjack is loaded at run time.
        # xvfb: an X server for the plug-in editor window tests (#147).
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev pkg-config mesa-vulkan-drivers libvulkan1 xvfb
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update && rustup default stable
        shell: bash
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: linux
      - name: Packaging version checks
        run: bash xtask/tests/packaging-version.sh
      - run: cargo fmt --all -- --check
      - run: cargo xtask timing
      # Check production host code without the integration tests' self-dev feature activation.
      - run: cargo check --locked -p transit-clap-host -p transit-vst3-host --lib
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Lib targets only: the dev-dependencies of the test targets turn the `testing` feature on, so a
      # warning that exists only with it off would otherwise reach the release build alone (#215).
      - run: cargo clippy --locked -p transit-mix -p transit-plugin-host -p transit-dsp -p transit-rt -- -D warnings
      # The native JACK backend (ADR 0021): its libjack calls build only with the feature. Its tests use
      # a fake server; no JACK server runs here.
      - run: cargo clippy --locked --workspace --all-targets --features transit/native-jack,audio-bench/native-jack -- -D warnings
      - run: cargo test --locked -p transit-audio-jack -p transit-playback -p audio-bench --features transit-audio-jack/libjack,transit-playback/native-jack,audio-bench/native-jack
      # The egui_kittest tests render with wgpu; the runner has no GPU, so use Mesa's CPU Vulkan
      # driver (lavapipe). Both variables are set because Vulkan loaders honor either name.
      - name: Test
        run: cargo test --locked --workspace
        env:
          WGPU_BACKEND: vulkan
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      # Plug-in editor windows on an X server (#147): the format hosts' and the host thread's
      # real-window tests skip without a DISPLAY in the step above. (transit-rt's editor_x11 starts
      # its own Xvfb there already.)
      - name: Test editor windows (Xvfb)
        run: xvfb-run -a cargo test --locked -p transit-rt -p transit-vst3-host -p transit-clap-host -p transit-plugin-host

  # crates/au-host and the objc2 code in crates/vst3-host compile only here.
  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update && rustup default stable
        shell: bash
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos
      # Check production host code without the integration tests' self-dev feature activation.
      - run: cargo check --locked -p transit-clap-host -p transit-vst3-host --lib
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
