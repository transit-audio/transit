[package]
name = "transit-random-sequencer"
description = "transit's random sequencer (random gates and voltages through a scale, with deja vu loops), ported to Rust from Émilie Gillet's MIT firmware and nulled against the C++ oracle (ADR 0033, #202)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
# transit's own code is MIT OR Apache-2.0; the firmware it is ported from is MIT (LICENSE-THIRD-PARTY).
license = "(MIT OR Apache-2.0) AND MIT"
publish = false

[features]
# The state record of the testing seams (ADR 0029, amendment for #742): `record` and every type's
# record and restore. Never a default feature.
testing = ["dep:transit-state-record"]

[dependencies]
transit-state-record = { workspace = true, optional = true }

[dev-dependencies]
transit-macro-osc-oracle = { path = "../macro-osc-oracle" }
transit-random-sequencer = { workspace = true, features = ["testing"] }

[lints]
workspace = true
