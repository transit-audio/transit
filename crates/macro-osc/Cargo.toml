[package]
name = "transit-macro-osc"
description = "transit's macro oscillator: 24 synthesis engines ported to Rust from Émilie Gillet's MIT firmware, nulled against the C++ oracle (ADR 0033, #195)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
# transit's own changes are MIT OR Apache-2.0; the vendored Rust port and the firmware it derives
# from are MIT (LICENSE-THIRD-PARTY).
license = "(MIT OR Apache-2.0) AND MIT"
publish = false

[features]
# Test seams: the voice's complete state record and restore (ADR 0029, amendment for #742); never
# enabled by the app. The codec is the crate's only workspace dependency, optional behind it.
testing = ["dep:transit-state-record"]

[dependencies]
num-traits = "0.2"
transit-state-record = { workspace = true, optional = true }

[dev-dependencies]
transit-macro-osc-oracle = { path = "../macro-osc-oracle" }
# Turns the `testing` feature on for this crate's own test targets (the record's unit tests).
transit-macro-osc = { workspace = true, features = ["testing"] }

[lints]
workspace = true
