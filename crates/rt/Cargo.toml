[package]
name = "transit-rt"
description = "transit realtime OS support: promotes audio worker threads (MMCSS, SCHED_FIFO, Mach time constraint) behind a safe API (ADR 0013: the only home for new unsafe)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# Use the portable fallback on every platform (tests and builds that must never touch thread
# scheduling). `promote_audio_thread` then always returns `Promotion::Unsupported`.
force-fallback = []
# Test support: `transit_rt::testing::promotion_calls()`. Off in release builds.
testing = []

[dependencies]
log.workspace = true

# Both already in the dependency tree (cpal, clap-host, vst3-host): no new dependency family.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "=0.2.190"

# Linux plug-in editor windows (issue #147): the pure-Rust X11 client already in the tree (winit),
# no default features (no libxcb, no unsafe of its own).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.13.2", default-features = false }

# Linux editor windows on a real X server (issue #147): its own runner, which starts a private Xvfb
# when there is no DISPLAY (run it under `xvfb-run -a` in CI).
[[test]]
name = "editor_x11"
harness = false

# ADR 0013: this crate is where new `unsafe` lives. It opts out of the workspace
# `unsafe_code = "forbid"` for itself only; every block carries a `// SAFETY:` comment and every
# `unsafe fn` a `# Safety` section. The rest mirrors `[workspace.lints]`, plus clippy pedantic.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "forbid"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
