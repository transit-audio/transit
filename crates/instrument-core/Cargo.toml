[package]
name = "transit-instrument-core"
description = "transit's shared instrument primitives: the per-voice shaper (filter, two LFOs, envelopes), the 16-row modulation matrix, the state-variable filter, the LFO and the ADSR used by the built-in instruments (ADR 0041)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
default = ["std"]
# The desktop arithmetic: the inherent float methods. Off, the crate is `no_std` and `libm` supplies
# them (ADR 0037 Tier B; CI checks that configuration for thumbv7em-none-eabihf).
std = []
# Test seams (state fingerprints for dsp's `Plugin::fingerprint`, issue #210); never enabled by the app.
testing = []

[dependencies]
# The float functions of the no-default (`no_std`) configuration only; unused with `std`.
libm.workspace = true

[lints]
workspace = true
