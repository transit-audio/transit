[package]
name = "transit-dsp"
description = "transit DSP: realtime plugins (EQ, dynamics, reverb, delay, modulation, instruments), meters, loudness, and offline AudioSuite-style processing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# Test seams (`Plugin::fingerprint`, issue #210); never enabled by the app.
testing = []

[dependencies]
serde.workspace = true
log.workspace = true
rustfft.workspace = true
rtrb.workspace = true
# The Macro Oscillator instrument (ADR 0033): a same-layer (L1) dependency.
transit-macro-osc.workspace = true
# The Texture insert (ADR 0033, #241): a same-layer (L1) dependency.
transit-texture.workspace = true
# The Time Stretcher insert (ADR 0033, #199): a same-layer (L1) dependency.
transit-granular.workspace = true
# The Cross Modulator insert (ADR 0033, #200): a same-layer (L1) dependency.
transit-modulator.workspace = true

[dev-dependencies]
proptest.workspace = true
# The Texture's allocation probe (`tests/texture_alloc.rs`) counts heap use on the test thread.
transit-rt = { workspace = true, features = ["testing"] }
# The Cross Modulator's firmware-exact path is checked against the C++ oracle (dev-only, ADR 0033).
transit-macro-osc-oracle = { path = "../macro-osc-oracle" }

[lints]
workspace = true
