[package]
name = "transit-dsp"
description = "transit DSP: realtime plugins (EQ, dynamics, reverb, delay, modulation, instruments), meters, loudness, and offline AudioSuite-style processing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# Test seams (`Plugin::fingerprint`, issue #210, over the state record codec of ADR 0029's #742
# amendment); never enabled by the app.
# `transit-sampler-core/testing` gives the Sampler's core path its state fingerprint;
# `transit-parametric-eq/testing` the Parametric EQ core's (ADR 0054).
testing = ["dep:transit-state-record", "transit-instrument-core/testing", "transit-sampler-core/testing", "transit-parametric-eq/testing"]

[dependencies]
serde.workspace = true
log.workspace = true
rustfft.workspace = true
rtrb.workspace = true
# The Macro Oscillator instrument (ADR 0033): a same-layer (L1) dependency.
transit-macro-osc.workspace = true
# The Texture insert (ADR 0033, #241): a same-layer (L1) dependency.
transit-texture.workspace = true
# The Time Stretcher insert (ADR 0033, #199): a same-layer (L1) dependency.
transit-granular.workspace = true
# The Cross Modulator insert (ADR 0033, #200): a same-layer (L1) dependency.
transit-modulator.workspace = true
# The Resonator instrument (ADR 0033, #198): a same-layer (L1) dependency.
transit-resonator.workspace = true
# The Modal Voice instrument (ADR 0033, #198 slice 2): a same-layer (L1) dependency.
transit-modal-voice.workspace = true
# The Random Sequencer MIDI effect (ADR 0033, #202): a same-layer (L1) dependency.
transit-random-sequencer.workspace = true
# The shared instrument primitives (shaper, matrix, SVF, LFO, ADSR; ADR 0041): a same-layer (L1) dependency.
# `std` named explicitly (ADR 0037): a future minimal dsp configuration cannot turn it on by accident.
transit-instrument-core = { workspace = true, features = ["std"] }
# The portable Sampler core (ADR 0041) the Sampler's core path plays through: a same-layer (L1)
# dependency, `std` named explicitly (ADR 0037). sampler-core never depends on dsp.
transit-sampler-core = { workspace = true, features = ["std"] }
# The Parametric EQ core (ADR 0054): a same-layer (L1) dependency, `std` named explicitly (ADR 0037).
# The device wrapper arrives with the next slice; parametric-eq never depends on dsp.
transit-parametric-eq = { workspace = true, features = ["std"] }
# The lossless state record of the testing seams (ADR 0029, #742): enabled only through `testing`.
transit-state-record = { workspace = true, optional = true }

[dev-dependencies]
# Turns the `testing` feature on for this crate's own test targets, so `cargo test -p transit-dsp` alone sees
# the test-only items (`spectrum`, `offline::non_silent_ranges`).
transit-dsp = { workspace = true, features = ["testing"] }
proptest.workspace = true
# The transplant harness keeps lossless state records (ADR 0029, #742).
transit-state-record.workspace = true
# Portable FFT and analysis math for the offline Macro Oscillator quality audit.
transit-math.workspace = true
# The Texture's allocation probe (`tests/texture_alloc.rs`) counts heap use on the test thread.
transit-rt = { workspace = true, features = ["testing"] }
# The Cross Modulator's firmware-exact path is checked against the C++ oracle (dev-only, ADR 0033).
transit-macro-osc-oracle = { path = "../macro-osc-oracle" }

[lints]
workspace = true
