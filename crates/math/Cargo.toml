[package]
name = "transit-math"
description = "transit's portable math seam: the transcendental functions every rendered crate calls, backed by the exactly pinned pure-Rust libm so a render is bit-identical on every platform, the exact gain conversions, and the one FFT for rendered code (ADR 0055)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The only dependency, pinned exactly in the workspace (ADR 0055, 2.1). Its default feature `arch`
# stays on (the workspace entry does not change it): it selects exactly rounded hardware instructions for
# `sqrt`, `fma` and (AArch64) `rint` only, which no v1 transcendental function here calls apart from
# `pow`'s exact `sqrt` case.
libm.workspace = true

[dev-dependencies]
# Tests and examples only, never linked into a rendered build (the layer check skips dev-dependencies):
# rustfft for the FFT's comparison and bench (display code keeps it; rendered code may not, ADR 0055 2.7),
# transit-rt's counting allocator for the FFT's no-allocation test (this crate stays free of unsafe).
rustfft.workspace = true
transit-rt = { workspace = true, features = ["testing"] }

[lints]
workspace = true
