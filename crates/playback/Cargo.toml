[package]
name = "transit-playback"
description = "transit audio device I/O: realtime playback and recording through the mix engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
transit-time.workspace = true
transit-audio-io.workspace = true
transit-audio-backend.workspace = true
transit-model.workspace = true
transit-mix.workspace = true
transit-dsp.workspace = true
transit-rt.workspace = true
transit-plugin-host.workspace = true
transit-clap-host.workspace = true
transit-vst3-host.workspace = true
log.workspace = true
serde.workspace = true
rtrb.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal.workspace = true
triple_buffer.workspace = true
transit-midi-io.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# Backend startup owns registration and release; never promote from the data callback.
cpal = { workspace = true, features = ["audio_thread_priority"] }

[target.'cfg(windows)'.dependencies]
# The native WASAPI backend (ADR 0016), behind the `native-wasapi` feature.
transit-audio-wasapi = { workspace = true, optional = true }

[target.'cfg(all(windows, target_pointer_width = "64"))'.dependencies]
# The native ASIO backend (draft ADR 0016 amendment), behind the `native-asio` feature.
transit-audio-asio = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The native JACK backend (ADR 0021), behind the `native-jack` feature.
transit-audio-jack = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"] }

[features]
# Device-free callback probes used only by dependent crates' tests.
test-hooks = []
# The native WASAPI render backend (ADR 0016 slice c): the "Native WASAPI" choice in
# Audio Devices. Off by default; without it the choice is not offered and `Backend::NativeWasapi` opens cpal.
native-wasapi = ["dep:transit-audio-wasapi"]
# The native ASIO backend (no Steinberg SDK, no LLVM): the "Native ASIO" choice in
# Audio Devices on the ASIO system. Off by default; without it the choice is not offered and
# `Backend::NativeAsio` opens cpal.
native-asio = ["dep:transit-audio-asio"]
# The native JACK backend (ADR 0021; JACK 2 or PipeWire's libjack, loaded at run time): the
# "Native JACK" choice in Audio Devices on the JACK system. Linux only; off by default; without it
# the JACK system is not listed and `Backend::NativeJack` opens cpal. The build needs jack.pc
# (libjack-jackd2-dev) for jack-sys's build script, not libjack itself.
native-jack = ["dep:transit-audio-jack", "transit-audio-jack/libjack"]

[dev-dependencies]
transit-plugin-host = { workspace = true, features = ["testing"] }
transit-rt = { workspace = true, features = ["testing"] }
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
transit-midi-io = { workspace = true, features = ["fake"] }

[lints]
workspace = true
