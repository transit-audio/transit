[package]
name = "transit-mix"
description = "transit mix engine: renders a session's tracks, plugins, sends, busses and automation to audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
transit-time.workspace = true
transit-audio-io.workspace = true
transit-midi.workspace = true
transit-dsp.workspace = true
transit-clap-host.workspace = true
transit-vst3-host.workspace = true
transit-au-host.workspace = true
transit-model.workspace = true
transit-rt.workspace = true
log.workspace = true
rayon.workspace = true

[features]
# Test seams (state fingerprints, muted serial blocks, the deterministic deadline; issue #210);
# never enabled by the app.
testing = ["transit-dsp/testing"]

[dev-dependencies]
transit-rt = { workspace = true, features = ["testing"] }
transit-mix = { path = ".", features = ["testing"] }
transit-clap-host = { workspace = true, features = ["test-hooks"] }

[lints]
workspace = true
