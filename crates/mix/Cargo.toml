[package]
name = "transit-mix"
description = "transit mix engine: renders a session's tracks, plugins, sends, busses and automation to audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
transit-time.workspace = true
transit-audio-io.workspace = true
transit-midi.workspace = true
transit-dsp.workspace = true
transit-clap-host.workspace = true
transit-vst3-host.workspace = true
transit-au-host.workspace = true
transit-model.workspace = true
transit-rt.workspace = true
log.workspace = true
rayon.workspace = true
# The lossless state record of the testing seams (ADR 0029, #742): enabled only through `testing`.
transit-state-record = { workspace = true, optional = true }

[features]
# Test seams (state fingerprints, muted serial blocks, the deterministic deadline; issue #210);
# never enabled by the app.
testing = ["dep:transit-state-record", "transit-dsp/testing", "transit-rt/testing"]

[dev-dependencies]
transit-test-support.workspace = true
# The test plug-ins write their state records (ADR 0029, #742).
transit-state-record.workspace = true
serde_json.workspace = true
transit-rt = { workspace = true, features = ["testing"] }
transit-mix = { path = ".", features = ["testing"] }
transit-clap-host = { workspace = true, features = ["test-hooks"] }
# The clip reader itself, the reference a stretched clip's render is compared with (#604).
transit-resample = { workspace = true, features = ["std"] }

[lints]
workspace = true
