[package]
name = "transit"
description = "transit desktop app: the studio UI over the engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# A once-a-day check for a newer release (one anonymous request to the GitHub API). Headless and distro builds can leave it out.
# The native Windows audio backends (WASAPI, and ASIO on 64-bit Windows) are not features: every
# Windows build has them (ADR 0046).
default = ["update-check"]
update-check = ["dep:ureq", "dep:semver"]
# The native JACK backend (ADR 0021, Linux): the "Native JACK" choice when Audio system is JACK.
native-jack = ["transit-playback/native-jack"]

[dependencies]
transit-engine.workspace = true
transit-ui-studio.workspace = true
transit-playback.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui.workspace = true
serde_json.workspace = true
log.workspace = true
transit-rt.workspace = true
transit-automation.workspace = true
rfd.workspace = true
ureq = { workspace = true, optional = true }
semver = { workspace = true, optional = true }

# The window handle eframe hands the creation closure, to set the taskbar icon (#50). Already in the tree.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
# Icon + VERSIONINFO for transit.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"
