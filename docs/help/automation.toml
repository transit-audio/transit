[[entry]]
id = "automation.touch_return"
name = "Touch return ramp"
text = "Time in milliseconds for a released Touch control to return to its recorded automation: 0 to 2000 ms, default 200 ms; 0 returns immediately. Saved with this session under File > Session Settings > Automation. Changes reach the audio engine with the next plan swap; a return already running finishes at its original duration."
