area = "options"
link = "user-guide.md#low-latency-mode"

[[entry]]
id = "options.low_latency"
name = "Low Latency"
text = "The same per-machine Low Latency switch as the transport button. It does not change session bypass settings."

[[entry]]
id = "options.middle_c"
name = "Middle C"
text = "The name MIDI note 60 carries in every transit window: C3 (the default) or C4 (scientific pitch). Display only: sessions and presets keep MIDI numbers, and commands read note names as C3 = 60 whatever this setting."

[[entry]]
id = "options.monitor_armed"
name = "Monitor Armed Tracks"
text = "On (the default): an armed audio track is heard while stopped and while recording. Off: arming does not monitor it, so an interface with its own direct monitoring is not heard twice; the take still records the input, and a track's Input Monitoring button (I) still monitors it. While recording with it off, an armed audio track plays what it already holds, as an unarmed track does. Either way, an armed audio track's meter shows its input level while stopped and while recording; unmonitored, that is the level the take records, before inserts and fader. Instrument and MIDI tracks are not affected. Saved on this machine, never in the session."
