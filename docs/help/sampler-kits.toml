# The Sampler's kit presets in its title bar: the kit list, previous and next, Save, Save As, Delete.
area = "sampler-kits"
title = "Sampler kit presets"
link = "user-guide.md#kit-presets"

[[entry]]
id = "sampler_kits.field"
name = "Kit presets"
text = "The kit last recalled or saved in this window, or <factory default>. Click to list your kit files, recall one, save the kit under a new name or delete the shown kit. A kit file points at its samples by path; no audio is copied."

[[entry]]
id = "sampler_kits.previous"
name = "Previous kit"
text = "Recalls the kit before this one in the list, wrapping at the start. A run of previous and next steps is one undo step. When the kit has loaded pads and has changed since its last recall or save, you are asked first."

[[entry]]
id = "sampler_kits.next"
name = "Next kit"
text = "Recalls the kit after this one in the list, wrapping at the end. A run of previous and next steps is one undo step. When the kit has loaded pads and has changed since its last recall or save, you are asked first."

[[entry]]
id = "sampler_kits.save"
name = "Save kit"
text = "Writes the kit over the kit file last recalled or saved in this window. Without one, it opens the list, where Save As names a new kit file."

[[entry]]
id = "sampler_kits.save_as"
name = "Save As"
text = "Saves the whole kit (pads, zones, slices, groups and every setting) as a new kit file under the typed name. Samples are referenced by their file paths, relative when they sit beside or below the kit file."

[[entry]]
id = "sampler_kits.delete"
name = "Delete kit"
text = "Deletes the shown kit's file from your kit folder. The kit on the Sampler stays as it is."
