# The device chain below the mixer: instrument, effects, sidechain keys and hardware.
area = "device-chain"
title = "Device chain"
link = "user-guide.md"

[[entry]]
id = "device_chain.add"
name = "Add effect"
text = "Adds an effect, a hardware insert or a plug-in to the end of the chain. A chain holds up to ten devices."

[[entry]]
id = "device_chain.hardware_insert"
name = "Hardware insert"
text = "Sends the signal out of one path of the audio interface through outboard gear and brings it back on another. Measure its delay in Audio Devices so it lines up."

[[entry]]
id = "device_chain.bypass"
name = "Bypass"
text = "Turns the device off without removing it, so you can compare with and without it. Click again to turn it back on."

[[entry]]
id = "device_chain.remove"
name = "Remove"
text = "Takes the device out of the chain. Undo brings it back."

[[entry]]
id = "device_chain.title"
name = "Device title"
text = "Drag to reorder the chain, Alt-drag to copy the device, double-click to open its window."

[[entry]]
id = "device_chain.instrument"
name = "Instrument"
text = "The plug-in that makes sound from this track's MIDI. Click to choose one or replace it."

[[entry]]
id = "device_chain.hardware_synth"
name = "Hardware synth"
text = "Plays a hardware synth: the track's MIDI goes to its port and its audio comes back on an input path."

[[entry]]
id = "device_chain.midi_effects"
name = "MIDI effects"
text = "Change the notes before the instrument plays them: each effect works on what the one above it put out, top to bottom. They play clips and live input alike, at the same timing."

[[entry]]
id = "device_chain.midi_effect_add"
name = "Add MIDI effect"
text = "Adds Transpose or Velocity at the bottom of the MIDI effects, just before the instrument. A track holds up to eight."

[[entry]]
id = "device_chain.midi_effect"
name = "MIDI effect"
text = "One MIDI effect. Right-click to move it up or down. Adding, removing, moving or bypassing an effect ends the notes it is playing, so none is left hanging."

[[entry]]
id = "device_chain.midi_transpose"
name = "Transpose"
text = "Moves every note up or down by whole semitones (up to four octaves either way). A note that would leave the keyboard is not played. Changing the amount while a note sounds keeps that note where it started."

[[entry]]
id = "device_chain.midi_velocity"
name = "Velocity"
text = "Reshapes how hard notes are played: Scale multiplies the velocity (100 % leaves it), Offset adds to it, and Minimum and Maximum keep the result between them. A note always keeps a velocity of at least 1."

[[entry]]
id = "device_chain.sidechain"
name = "Sidechain key"
text = "Makes a compressor or gate listen to another track or bus instead of this one, for example to duck a pad under a kick."

[[entry]]
id = "device_chain.rack_macro"
name = "Macro"
text = "One of the rack's eight macro knobs. Right-click to map a parameter of an instrument or effect in the rack, set the mapping's range and curve, or MIDI Learn the knob. Moving it moves every mapped parameter."

[[entry]]
id = "device_chain.rack_zone"
name = "Zone"
text = "The keys (or velocities) this instrument plays in the rack. Drag low in the bar to move an edge, high in the bar to move a fade handle: inside a fade the note plays softer toward the edge."

[[entry]]
id = "device_chain.rack_play"
name = "Play"
text = "Lets the rack take live MIDI: every instrument whose zones hold a note plays it."
