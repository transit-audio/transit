[package]
name = "audio-bench"
description = "Audio backend benchmark harness (ADR 0016 slice b): callback jitter, achieved period, xruns and loopback round trip through the backend trait"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
# `--backend jack --list-devices`: the native JACK backend's listing (ADR 0021 slice 1), Linux only.
# Measuring through it comes with slice 2.
native-jack = ["transit-playback/native-jack"]

[dependencies]
serde_json.workspace = true
transit-audio-backend.workspace = true
transit-playback.workspace = true
# `--midi-roundtrip`: the MIDI output port the note goes to.
transit-midi-io.workspace = true
# `--midi-roundtrip` releases its note on Ctrl+C (a console's default handler ends the process without unwinding).
ctrlc = "=3.5.2"

# `--backend wasapi`: the native WASAPI backend (ADR 0016 slice c), on every Windows build (ADR 0046).
[target.'cfg(windows)'.dependencies]
transit-audio-wasapi.workspace = true

# `--backend asio`: the native ASIO backend (draft ADR 0016 amendment, ASIO slice b), on every
# 64-bit Windows build. No ASIO SDK and no LLVM.
[target.'cfg(all(windows, target_pointer_width = "64"))'.dependencies]
transit-audio-asio.workspace = true

[dev-dependencies]
transit-test-support.workspace = true
transit-midi-io = { workspace = true, features = ["fake"] }
transit-rt = { workspace = true, features = ["testing"] }

[lints]
workspace = true
